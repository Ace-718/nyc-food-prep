:"Mashed Potatoes in Hot Holding Steam Table Holding at 125°F",isViolation:!0,violationCode:"2B",violationTitle:"Hot food item not held at or above 140°F",severity:"Critical",points:7,explanation:"Hot holding units must maintain food constantly at 140°F or higher. 125°F is inside the dangerous Temperature Danger Zone.",correctiveAction:"Rapidly reheat potatoes on stove to 165°F within 2 hours or discard if out of temp >2 hours."},{id:"item-ground-beef-temp",label:"Hamburger Patty Cooked to 158°F for 15 Seconds",isViolation:!1,explanation:"Perfect! 158°F for 15 seconds is the required minimum internal temperature for ground meats to eliminate E. coli O157:H7.",correctiveAction:"Serve or place in hot holding at 140°F+."},{id:"item-steamtable-reheating",label:"Cold Leftover Chili Placed Directly into Steam Table to Heat Up",isViolation:!0,violationCode:"2C",violationTitle:"Reheating cold food on steam table / hot holding unit",severity:"Critical",points:7,explanation:"Steam tables are designed ONLY to hold already-hot food, never to reheat cold foods. Reheating must be done rapidly on a stove or oven to 165°F within 2 hours.",correctiveAction:"Transfer chili immediately to stove or oven and reheat to 165°F."},{id:"item-barehand-sandwich",label:"Cook Using Bare Hands to Place Sliced Deli Turkey on Bread",isViolation:!0,violationCode:"4C",violationTitle:"Bare hand contact with ready-to-eat (RTE) food",severity:"PHH",points:10,explanation:"NYC Health Code strictly prohibits bare hand contact with ready-to-eat foods. Food workers must use sanitary disposable gloves, tongs, deli paper, or utensils.",correctiveAction:"Discard the bare-hand handled sandwich. Wash hands and put on clean single-use gloves."}]},{id:"station-dishwashing",station:"3-Compartment Dishwashing",title:"Manual Warewashing & Sanitization Area",description:"Inspect the 3-compartment manual dishwashing sink, water temperatures, sanitizer chemical test strips, and drying racks.",clues:["Check temperatures i zed utensils and tableware be dried?"}),s.jsx("div",{className:"grid grid-cols-1 sm:grid-cols-2 gap-2.5",children:[{label:"Towel Dry with Clean Kitchen Cloth",val:"towel"},{label:"Air Dry on Clean Drainboard (No Towels!)",val:"air-dry"}].map(S=>s.jsx("button",{onClick:()=>le(S.val),className:`p-4 rounded-2xl border text-center font-bold text-xs transition-all ${de===S.val?"bg-emerald-600 text-white border-emerald-400 shadow-md":"bg-slate-850 text-slate-200 border-slate-700 hover:bg-slate-800"}`,children:S.label},S.val))}),s.jsxs("button",{onClick:Se,disabled:!de,className:"w-full py-3 bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-slate-950 font-black text-xs rounded-xl shadow-md flex items-center justify-center gap-1 active:scale-95 transition-all",children:["Complete Dishwashing Protocol ",s.jsx(bt,{className:"w-4 h-4"})]})]})]})]})},cs=[{id:"q1-1",source:"Manual Quiz No. 1 (p.75)",question:"Potentially hazardous foods provide conditions favorable for bacterial growth.",options:["TRUE","FALSE"],correctAnswer:0,explanation:"TRUE: Potentially Hazardous Foods (PHF/TCS) are high in protein, starch, and moisture with neutral pH, providing ideal conditions for rapid microorganism reproduction.",category:"microbiology",manualPage:75},{id:"q1-2",source:"Manual Quiz No. 1 (p.75)",question:"Shellfish tags must be kept with the product and then filed away in chronological order of delivery for how many days?",options:["30 days","60 days","90 days","180 days"],correctAnswer:2,explanation:"90 days: Shellfish tags (clams, oysters, mussels) must remain with the batch until completely used up, and then kept filed in order of delivery for 90 days to assist traceback of Hepatitis A / Norovirus outbreaks.",category:"food-source",manualPage:75},{id:"q1-3",source:"Manual Quiz No. 1 (p.75)",question:'The acronym "FIFO" stands for "First In, First Out". What is the first essential step in implementing FIFO?',options:["Rotating the stock immediately","Dating all products as they are received","Placing new products on the front shelf","Throwing away open packages"],correctAnswer:1,explanation:"Dating the products upon arrival is the first step in implementing FIFO stock rotation so workers know which items were received first.",category:"hygiene",manualPage:75},{id:"q1-4",source:"Manual Quiz No. 1 (p.75)",question:"To show that it is wholesome, meat inspected by the U.S. Department of Agriculture (USDA) will have the:",options:["USDA grade stamp","USDA inspection stamp","FDA organic seal","DOHMH approval seal"],correctAnswer:1,explanation:"USDA inspection stamp indicates the meat is sanitary, wholesome, and fit for human consumption. Grade stamps only indicate commercial quality/tenderness.",category:"food-source",manualPage:75},{id:"q1-5",source:"Manual Quiz No. 1 (p.75)",question:"The Temperature Danger Zone for food is between 41°F and 140°F. Within this range, harmful bacteria:",options:["Die rapidly","Reproduce rapidly","Remain completely dormant","Are converted to spores"],correctAnswer:1,explanation:"Reproduce rapidly: Harmful bacteria multiply rapidly in the Temperature Danger Zone (41°F to 140°F), doubling every 20-30 minutes under ideal conditions.",category:"temperature",manualPage:75},{id:"q1-6",source:"Manual Quiz No. 1 (p.75)",question:"In a refrigerator, raw food products should be stored _____ cooked or ready-to-eat foods to prevent _____ ________.",options:["Above; food spoilage","Below; cross-contamination","Beside; freezer burn","Under; condensation only"],correctAnswer:1,explanation:"Below cooked foods to prevent cross-contamination from raw meat/poultry juices dripping onto ready-to-eat items.",category:"hygiene",manualPage:75},{id:"q1-7",source:"Manual Quiz No. 1 (p.75)",question:"Which of the following defects will cause canned foods to be rejected and removed from circulation?",options:["Minor label tears only","Swollen ends, severe dents on seams, severe rust, and leaks","Slightly concave ends","Dust on the can lid"],correctAnswer:1,explanation:"Swollen ends (indicating gas from Clostridium botulinum), severe dents along the 3 seams (top/bottom/side), severe rust, and leaking cans must be immediately removed from circulation.",category:"food-source",manualPage:75},{id:"q1-8",source:"Manual Quiz No. 1 (p.75)",question:"A glass thermometer should NEVER be used for measuring food temperature in a restaurant. What approved thermometers can be used?",options:["Mercury clinical thermometer and candy glass tube","Bi-metallic stem thermometer, thermocouple, and digital thermistor","Infrared laser gun only","Wall clock thermometer"],correctAnswer:1,explanation:"Bi-metallic stem thermometers (0°F to 220°F range), thermocouples, and digital thermistor thermometers are approved. Glass thermometers risk physical hazard contamination from broken glass.",category:"temperature",manualPage:75},{id:"q1-9",source:"Manual Quiz No. 1 (p.75)",question:"Fresh raw shell eggs must be received and stored in a refrigerator at an ambient temperature of:",options:["32°F or below","38°F or below","45°F or lower","50°F or lower"],correctAnswer:2,explanation:"45°F or lower: NYC Health Code requires fresh shell eggs to be delivered in refrigerated trucks and kept refrigerated at an ambient temperature of 45°F or below until used.",category:"temperature",manualPage:75},{id:"q1-10",source:"Manual Quiz No. 1 (p.75)",question:"All food items, dry goods, and equipment must be stored at least how high off the floor?",options:["2 inches","4 inches","6 inches","12 inches"],correctAnswer:2,explanation:"6 inches off the floor to facilitate floor cleaning and enable inspection for rodent droppings or vermin harborage.",category:"hygiene",manualPage:75},{id:"q1-11",source:"Manual Quiz No. 1 (p.75)",question:"Cold temperatures kill bacteria.",options:["TRUE","FALSE"],correctAnswer:1,explanation:"FALSE: Cold temperatures (refrigeration and freezing) only SLOW DOWN or inhibit bacterial growth; they DO NOT destroy or kill microorganisms.",category:"microbiology",manualPage:75},{id:"q1-12",source:"Manual Quiz No. 1 (p.75)",question:"People, both food workers and customers, pose the greatest risk to food safety.",options:["TRUE","FALSE"],correctAnswer:0,explanation:"TRUE: Humans are the main source of food contamination (transmitting Staph from skin/nose, Hepatitis A, Norovirus, and Shigella via poor hygiene and bare hand contact).",category:"hygiene",manualPage:75}],fm=[{id:"q2-1",source:"Manual Quiz No. 2 (p.76)",question:"Under favorable growth conditions (warmth, moisture, nutrients), bacteria can double their population every:",options:["2 to 3 minutes","20 to 30 minutes","2 to 3 hours","24 hours"],correctAnswer:1,explanation:"20 to 30 minutes by binary fission (splitting in two). One single bacterium can produce 256,000 bacteria in just 4 hours.",category:"microbiology",manualPage:76},{id:"q2-2",source:"Manual Quiz No. 2 (p.76)",question:"When must hands be washed thoroughly by food workers?",options:["Only once at the start of the shift","Before starting work, after using the toilet, after touching raw meat, after coughing/sneezing, and between tasks","Only before handling money","Whenever the manager enters the kitchen"],correctAnswer:1,explanation:"Hands must be washed for at least 20 seconds with hot and cold running water and soap before starting work, between tasks, after using the toilet, coughing, sneezing, eating, smoking, or handling raw foods.",category:"hygiene",manualPage:76},{id:"q2-3",source:"Manual Quiz No. 2 (p.76)",question:"Hand-washing sinks must be located within how many feet of each food prep, service, and warewashing area?",options:["10 feet","25 feet","50 feet","100 feet"],correctAnswer:1,explanation:"Within 25 feet of all food prep, food service, and warewashing areas, and in or adjacent to restrooms, stocked with hot/cold running water, soap, and paper towels/hot air dryer.",category:"plumbing",manualPage:76},{id:"q2-4",source:"Manual Quiz No. 2 (p.76)",question:"Food workers sick with an illness transmissible through contact with food (e.g. Salmonella, Shigella, E. coli, Norovirus, Hep A) must be:",options:["Assigned only to washing dishes","Excluded from working in the food establishment until fully recovered","Allowed to work if wearing two pairs of gloves","Given antibiotics on site"],correctAnswer:1,explanation:"Excluded from working until fully recovered to prevent massive disease outbreaks.",category:"hygiene",manualPage:76},{id:"q2-5",source:"Manual Quiz No. 2 (p.76)",question:"Bacteria commonly found on the surface of raw chicken and poultry are called:",options:["Salmonella enteritidis","Staphylococcus aureus","Bacillus cereus","Trichinella spiralis"],correctAnswer:0,explanation:"Salmonella enteritidis is naturally associated with raw poultry and raw eggs and must be controlled by cooking poultry to 165°F.",category:"microbiology",manualPage:76},{id:"q2-6",source:"Manual Quiz No. 2 (p.76)",question:"A piece of metal shaving or broken glass in a food item is an example of a:",options:["Biological hazard","Chemical hazard","Physical hazard","Allergenic hazard"],correctAnswer:2,explanation:"Physical Hazard: Foreign objects such as glass, metal shavings, unfrilled toothpicks, stones, and jewelry.",category:"microbiology",manualPage:76},{id:"q2-7",source:"Manual Quiz No. 2 (p.76)",question:"Clostridium perfringens is often associated with stews and gravies in deep pots. We can control it by:",options:["Adding more salt","Rapidly cooling and rapidly reheating meat dishes","Leaving it on the counter covered","Freezing and refreezing"],correctAnswer:1,explanation:"Rapid cooling in shallow pans (140°F to 70°F in 2 hrs, then to 41°F in 4 hrs) and rapid reheating to 165°F within 2 hours.",category:"temperature",manualPage:76},{id:"q2-8",source:"Manual Quiz No. 2 (p.76)",question:"Home-canned foods cannot be used in a commercial food establishment because of the danger of:",options:["AIDS","Botulism (Clostridium botulinum)","Trichinosis","Ciguatera"],correctAnswer:1,explanation:"Botulism: Clostridium botulinum thrives in anaerobic sealed containers without professional commercial pressure/temperature retort processing.",category:"food-source",manualPage:76},{id:"q2-9",source:"Manual Quiz No. 2 (p.76)",question:"Smoked fish must be stored at or below 38°F. This is specifically to control the growth of:",options:["Salmonella","Clostridium botulinum","Trichinella spiralis","Hepatitis A"],correctAnswer:1,explanation:"Clostridium botulinum spores can germinate and produce deadly neurotoxins in vacuum/smoked fish unless held at 38°F or below.",category:"temperature",manualPage:76},{id:"q2-10",source:"Manual Quiz No. 2 (p.76)",question:"The parasitic disease Trichinosis is commonly associated with undercooked pork. To prevent it, pork must be cooked to a minimum internal temperature of:",options:["130°F for 10 minutes","140°F for 15 seconds","150°F for 15 seconds","165°F for 15 seconds"],correctAnswer:2,explanation:"150°F for 15 seconds destroys Trichinella spiralis larvae in pork and pork products.",category:"temperature",manualPage:76},{id:"q2-11",source:"Manual Quiz No. 2 (p.76)",question:"When using raw eggs in a food that will not be cooked or only cooked lightly (e.g. Caesar salad dressing, hollandaise, eggnog), you should use:",options:["Brown shell eggs","Pasteurized eggs","Air-cooled hard boiled eggs","Cage-free organic raw eggs"],correctAnswer:1,explanation:"Pasteurized eggs must be used whenever eggs will receive no cooking or limited heat treatment.",category:"food-source",manualPage:76},{id:"q2-12",source:"Manual Quiz No. 2 (p.76)",question:"Foods contaminated by harmful disease-causing microorganisms always have a spoiled or changed appearance, taste, and smell.",options:["TRUE","FALSE"],correctAnswer:1,explanation:"FALSE: Pathogenic bacteria generally DO NOT change the appearance, taste, or odor of food. A food may look, smell, and taste perfectly delicious while containing lethal doses of pathogens.",category:"microbiology",manualPage:76}],mm=[{id:"q3-1",source:"Manual Quiz No. 3 (p.77)",question:"The proper safe holding temperatures for potentially hazardous foods are:",options:["41°F or below for cold foods; 140°F or above for hot foods","50°F or below for cold; 130°F or above for hot","32°F for cold; 165°F for hot","45°F for cold; 120°F for hot"],correctAnswer:0,explanation:"Cold foods must be kept at 41°F or lower, and hot foods must be held at 140°F or higher to keep them out of the danger zone.",category:"temperature",manualPage:77},{id:"q3-2",source:"Manual Quiz No. 3 (p.77)",question:"When cooling hot foods in a refrigerator, they must be covered:",options:["When first placed in the refrigerator while steaming","Only AFTER they have been cooled down to 41°F","Never covered even when cold","Tightly sealed with aluminum foil immediately"],correctAnswer:1,explanation:"Covered AFTER being cooled to 41°F. Leaving foods uncovered allows heat and steam to escape rapidly without trapping moisture.",category:"temperature",manualPage:77},{id:"q3-3",source:"Manual Quiz No. 3 (p.77)",question:"Refrigerated cooked food that will be served hot must be rapidly reheated to 165°F within 2 hours using:",options:["A hot holding steam table","A stove, oven, or direct cooking equipment","A heat lamp","A crockpot on warm"],correctAnswer:1,explanation:"A stove or oven: Hot holding units (steam tables) are designed ONLY to maintain hot temperatures, not to rapidly reheat cold food.",category:"temperature",manualPage:77},{id:"q3-4",source:"Manual Quiz No. 3 (p.77)",question:"When harmful microorganisms are transferred from raw food or unclean equipment to cooked or ready-to-eat food, this is called:",options:["Cross-contamination","Pasteurization","Binary fission","Chemical intoxication"],correctAnswer:0,explanation:"Cross-contamination: The transmission of germs from raw food/surfaces to ready-to-eat foods.",category:"hygiene",manualPage:77},{id:"q3-5",source:"Manual Quiz No. 3 (p.77)",question:"The correct minimum internal cooking temperature for poultry, stuffed meat, and stuffing containing meat is:",options:["140°F for 15 sec","150°F for 15 sec","158°F for 15 sec","165°F for 15 sec"],correctAnswer:3,explanation:"165°F for 15 seconds to kill Salmonella and other bacteria common in poultry and stuffing.",category:"temperature",manualPage:77},{id:"q3-6",source:"Manual Quiz No. 3 (p.77)",question:"Thick foods (like chili, refried beans, and stews) cool faster in:",options:["Large amounts in deep stock pots","Small amounts in shallow pans (depth 1 to 2 inches)","Sealed 5-gallon plastic buckets","Covered insulated containers"],correctAnswer:1,explanation:"Shallow pans 4 inches deep with product depth 1-2 inches provide large surface area for heat to dissipate quickly.",category:"temperature",manualPage:77},{id:"q3-7",source:"Manual Quiz No. 3 (p.77)",question:"It is good practice to make cold salads (tuna, chicken, egg salad) with ingredients that were previously chilled to 41°F or lower.",options:["TRUE","FALSE"],correctAnswer:0,explanation:"TRUE: Pre-chilling all ingredients (tuna cans, mayonnaise, celery) keeps the mixture well out of the Danger Zone during mixing.",category:"hygiene",manualPage:77},{id:"q3-8",source:"Manual Quiz No. 3 (p.77)",question:"On a buffet table, maintaining proper food temperature is equally as important as having a proper sneeze guard.",options:["TRUE","FALSE"],correctAnswer:0,explanation:"TRUE: Both temperature control (hot ≥140°F, cold ≤41°F) and physical barriers (sneeze guards) prevent food contamination.",category:"hygiene",manualPage:77},{id:"q3-9",source:"Manual Quiz No. 3 (p.77)",question:"An air break (indirect waste connection) is legally required in the waste line of:",options:["Handwash sinks and floor drains","Potwash, culinary, and food prep sinks / ice machines","Employee toilets","Mop utility sinks"],correctAnswer:1,explanation:"Potwash and culinary sinks, ice machines, and steam tables require indirect waste connections with an air break to prevent sewage backup.",category:"plumbing",manualPage:77},{id:"q3-10",source:"Manual Quiz No. 3 (p.77)",question:"It is a good practice to thaw frozen foods by leaving them out on the kitchen counter overnight at room temperature.",options:["TRUE","FALSE"],correctAnswer:1,explanation:"FALSE: Thawing at room temperature is strictly prohibited as outer layers enter the Danger Zone for hours while the center thaws.",category:"temperature",manualPage:77},{id:"q3-11",source:"Manual Quiz No. 3 (p.77)",question:"When handling foods that have already been cooked and are ready to be eaten (RTE), we must use:",options:["Clean bare hands after washing","Sanitary gloves, tongs, spatulas, or deli paper","Cloth towels","Any metallic tool without sanitizing"],correctAnswer:1,explanation:"Bare hand contact is prohibited with ready-to-eat foods; use disposable single-use gloves, tongs, deli paper, or utensils.",category:"hygiene",manualPage:77},{id:"q3-12",source:"Manual Quiz No. 3 (p.77)",question:"To ensure that any food contact surface is safe to use, the 3-step sanitizing sequence is:",options:["Scraped, dried, and wiped","Washed, rinsed, and sanitized","Bleached, soaked, and towel dried","Rinsed, frozen, and scrubbed"],correctAnswer:1,explanation:"Washed with detergent, rinsed with clean water, and sanitized with approved heat/chemicals, then air-dried.",category:"hygiene",manualPage:77}],hm=[{id:"q4-1",source:"Manual Quiz No. 4 (p.78)",question:"Self-assessment of food operations is an excellent way to improve food defense, security, and general food safety practice.",options:["TRUE","FALSE"],correctAnswer:0,explanation:"TRUE: Regular self-inspections help managers identify and rectify violations before official DOHMH inspections.",category:"haccp",manualPage:78},{id:"q4-2",source:"Manual Quiz No. 4 (p.78)",question:"What are the three most common injuries among restaurant workers in the kitchen?",options:["Sunburn, heatstroke, and dehydration","Slips/trips/falls, cuts/lacerations, and burns/scalds","Headaches, food poisoning, and ear infections","Frostbite, insect bites, and fractures"],correctAnswer:1,explanation:"Slips/trips/falls from wet/greasy floors, cuts from knives/slicers, and burns/scalds from hot oil, steam, and cookware.",category:"law",manualPage:78},{id:"q4-3",source:"Manual Quiz No. 4 (p.78)",question:"What are suitable work shoes for food service workers in a commercial kitchen?",options:["Leather soled dress shoes","Canvas sneakers","Slip-resistant closed-toe shoes with grit traction","Open-toe flats or sandals"],correctAnswer:2,explanation:"Slip-resistant shoes protect workers from slip and fall injuries on wet or greasy floors.",category:"law",manualPage:78},{id:"q4-4",source:"Manual Quiz No. 4 (p.78)",question:"Who should be given unrestricted access to kitchen food preparation and storage areas?",options:["Customers and friends","Authorized kitchen staff only (cooks/food prep workers)","Any delivery driver or contractor without supervision","Anyone in uniform"],correctAnswer:1,explanation:"Access to food prep/storage areas must be strictly limited to authorized employees to protect food defense and prevent tampering.",category:"haccp",manualPage:78},{id:"q4-5",source:"Manual Quiz No. 4 (p.78)",question:"To prevent accidental lacerations and knife cuts, knives should be stored:",options:["Submerged in a soapy sink of dishwater","In designated knife racks or magnetic strips / knife drawers","Loose on cutting boards","Balanced on stove handles"],correctAnswer:1,explanation:"Knives must be kept in dedicated racks, blocks, or drawers, never left in sinks full of water where someone reaching in can be injured.",category:"law",manualPage:78},{id:"q4-6",source:"Manual Quiz No. 4 (p.78)",question:"It is acceptable for regular food workers to apply chemical pesticides in food establishments as long as label directions are followed.",options:["TRUE","FALSE"],correctAnswer:1,explanation:"FALSE: In NYC food establishments, applying chemical pesticides by food workers is illegal. Only a licensed Pest Control Operator (PCO) certified by DEC may apply pesticides.",category:"pest",manualPage:78},{id:"q4-7",source:"Manual Quiz No. 4 (p.78)",question:"The three key principles of Integrated Pest Management (IPM) are:",options:["Poison them, spray them, and fog them","Starve them, build them out, and destroy them","Trap them, relocate them, and feed them","Wash them, freeze them, and heat them"],correctAnswer:1,explanation:"1) Starve them (deprive of food/water), 2) Build them out (seal cracks/openings), 3) Destroy them (traps and licensed extermination).",category:"pest",manualPage:78},{id:"q4-8",source:"Manual Quiz No. 4 (p.78)",question:'Trans fat in foods raises LDL ("bad" cholesterol) and lowers HDL ("good" cholesterol), increasing the risk of heart disease.',options:["TRUE","FALSE"],correctAnswer:0,explanation:"TRUE: Artificial trans fat increases bad cholesterol and lowers good cholesterol, which led to the NYC Health Code ban of artificial trans fat in restaurants.",category:"law",manualPage:78},{id:"q4-9",source:"Manual Quiz No. 4 (p.78)",question:"Which foods frequently contain artificial trans fat unless made with trans-fat-free oils?",options:["Fresh raw fruits and vegetables","French fries, baked goods, vegetable shortenings, and partially hydrogenated margarines","Boiled eggs and fresh fish","Pasteurized skim milk"],correctAnswer:1,explanation:"Commercial frying oils with partially hydrogenated vegetable oil, baked pastries, shortenings, and stick margarines.",category:"law",manualPage:78},{id:"q4-10",source:"Manual Quiz No. 4 (p.78)",question:"What is the NYC Health Code regulation threshold for artificial trans fat per serving in restaurants?",options:["Must contain less than 0.5 grams trans fat per serving","Must contain less than 5 grams trans fat per serving","Trans fat is completely unrestricted","Only applies to packaged potato chips"],correctAnswer:0,explanation:"No food containing partially hydrogenated vegetable oils with 0.5 grams or more trans fat per serving may be stored, used, or served in NYC restaurants.",category:"law",manualPage:78}],pm=[{id:"qr-p2-1",source:"Quick Review (Page 2)",question:"All food service establishments in NYC must have a current and valid permit issued by the NYC Health Department.",options:["TRUE","FALSE"],correctAnswer:0,explanation:"TRUE: Every food service establishment must hold a valid NYC DOHMH permit.",category:"law",manualPage:2},{id:"qr-p2-2",source:"Quick Review (Page 2)",question:"Health Inspectors have the right to inspect a food service establishment as long as it is in operation, and must be given access to all areas.",options:["TRUE","FALSE"],correctAnswer:0,explanation:"TRUE: Public Health Sanitarians have legal right of entry and access to all facility areas during operating hours.",category:"law",manualPage:2},{id:"qr-p2-3",source:"Quick Review (Page 2)",question:"Health Inspectors are authorized to collect permit fees and cash fines on behalf of the Department on site.",options:["TRUE","FALSE"],correctAnswer:1,explanation:"FALSE: Sanitarians are NEVER authorized to collect money or conduct monetary transactions. Offering or collecting bribes/cash is a crime.",category:"law",manualPage:2},{id:"qr-p2-4",source:"Quick Review (Page 2)",question:"According to the NYC Health Code, who is required to hold a Food Protection Certificate?",options:["Every busser and dishwasher","Supervisors of food service establishments who must be on premises during all hours of food prep/operation","Only the building landlord","Only head chefs of 5-star Michelin restaurants"],correctAnswer:1,explanation:"Supervisors must hold the Food Protection Certificate and at least one certified supervisor must be on the premises during all hours of food preparation and operation.",category:"law",manualPage:2},{id:"qr-p11-1",source:"Quick Review (Page 11)",question:"Which of the following metals is PROHIBITED for food contact containers because of toxic metal poisoning?",options:["Food-grade stainless steel","Food-grade plastic","Copper, brass, zinc, antimony, lead, and cadmium","Cast iron with seasoning"],correctAnswer:2,explanation:"Copper, brass, zinc (galvanized), lead, antimony, and cadmium leach toxic chemicals into acidic foods and are prohibited.",category:"hygiene",manualPage:11},{id:"qr-p11-2",source:"Quick Review (Page 11)",question:"Ice intended for human consumption can be used for storing soda cans and beer bottles.",options:["TRUE","FALSE"],correctAnswer:1,explanation:"FALSE: Ice for human consumption must NEVER be used to chill cans/bottles, as dirty cans contaminate the consumable ice.",category:"hygiene",manualPage:11},{id:"qr-p12-1",source:"Manual Allergens (Page 12)",question:'What are the 8 Major Food Allergens recognized by law ("Food Problems Will Send The EMS")?',options:["Fish, Peanuts, Wheat, Soy, Tree nuts, Eggs, Milk, Shellfish","Rice, Beef, Corn, Chicken, Apples, Potatoes, Pork, Oats","Sugar, Salt, MSG, Gluten, Yeast, Oil, Vinegar, Pepper","Garlic, Onion, Tomato, Celery, Carrot, Mushroom, Sesame, Mustard"],correctAnswer:0,explanation:"The 8 major allergens accounting for 90% of allergic reactions: Fish, Peanuts, Wheat, Soy, Tree nuts, Eggs, Milk, Shellfish.",category:"allergens",manualPage:12},{id:"qr-p13-1",source:"Quick Review (Page 13)",question:"What is the shape of Bacilli bacteria?",options:["Spherical / Round","Rod-shaped","Spiral / Comma shaped","Star-shaped"],correctAnswer:1,explanation:"Bacilli are rod-shaped. Cocci are spherical, and Spirilla are spiral/comma shaped.",category:"microbiology",manualPage:13},{id:"qr-p13-2",source:"Quick Review (Page 13)",question:"Can bacterial spores be easily destroyed by normal cooking temperatures?",options:["Yes, cooking to 140°F kills spores instantly","No, spores are highly resistant protective shells requiring much higher heat and time","Yes, freezing kills all spores","Yes, wiping with a paper towel destroys spores"],correctAnswer:1,explanation:"Bacterial spores have a thick protective wall that survives adverse heat and dehydration, resuming growth in the vegetative state when conditions become favorable.",category:"microbiology",manualPage:13},{id:"qr-p15-1",source:"Manual Conditions (Page 14-15)",question:"What is the acidity level (pH) below which foods are considered too acidic for bacteria to grow?",options:["pH 7.0","pH 6.5","pH 4.6 or below","pH 8.5"],correctAnswer:2,explanation:"pH 4.6 or lower is too acidic for most pathogenic bacteria (e.g. vinegar, lemon juice, pickles).",category:"microbiology",manualPage:14},{id:"qr-p15-2",source:"Manual Water Activity (Page 15)",question:"What Water Activity (aw) value is considered safe because bacteria have difficulty reproducing without available moisture?",options:["0.99","0.95","0.85 or less","1.0"],correctAnswer:2,explanation:"A water activity (aw) value of 0.85 or less does not have enough free moisture for active bacterial growth (e.g. crackers, honey, dried milk).",category:"microbiology",manualPage:15},{id:"qr-p16-1",source:"Microbiology (Page 16)",question:"Which of the following microorganisms CANNOT multiply or reproduce in food?",options:["Bacteria","Viruses (Hepatitis A, Norovirus)","Molds","Yeasts"],correctAnswer:1,explanation:"Viruses CANNOT multiply in food. Food only acts as a transport vehicle until the virus enters human host cells.",category:"microbiology",manualPage:16},{id:"qr-p23-1",source:"Personal Hygiene (Page 23)",question:"Can hand sanitizer be used as a substitute for washing hands with soap and water?",options:["Yes, hand sanitizer is always better than water","No, sanitizers are ineffective due to fats/grease on workers' hands and cannot replace 20-second handwashing","Yes, only during busy rush hours","Yes, if using 100% pure alcohol"],correctAnswer:1,explanation:"No: Germicidal soaps and sanitizers are not effective on hands covered in fat molecules. Hand sanitizers can only be used in addition to, never in place of, handwashing.",category:"hygiene",manualPage:23},{id:"qr-p30-1",source:"Quick Review (Page 30)",question:"What is the NYC 2-Stage Cooling Rule for potentially hazardous cooked foods?",options:["Cool from 140°F to 70°F within 2 hours, and from 70°F to 41°F within an additional 4 hours (total 6 hours max)","Cool from 140°F to 41°F in 12 hours","Cool to room temperature overnight on counter","Put boiling 10-gallon soup pot directly into freezer with lid on"],correctAnswer:0,explanation:"Step 1: Cool from 140°F to 70°F within 2 hours. Step 2: Cool from 70°F to 41°F or lower within an additional 4 hours.",category:"temperature",manualPage:30},{id:"qr-p31-1",source:"Cleaning & Sanitizing (Page 31-32)",question:"In manual dishwashing using a 3-compartment sink, how is chemical chlorine sanitization performed in the 3rd sink?",options:["50 PPM chlorine solution at 75°F+ with dishes immersed for at least 60 seconds (1 minute)","10 PPM chlorine for 5 seconds in boiling water","1000 PPM chlorine solution mixed with hand soap","Soaking in vinegar for 10 minutes"],correctAnswer:0,explanation:"50 PPM chlorine at 75°F to 140°F for at least 1 minute (60 seconds). (Made with 1/2 oz or 1 tbsp bleach per gallon water).",category:"hygiene",manualPage:31},{id:"qr-p32-1",source:"Manual Dishwashing (Page 32)",question:"After sanitizing in the third sink, how should dishes and utensils be dried?",options:["Towel dried with a clean kitchen towel","Air dried on clean drainboards (no towel drying!)","Dried with an electric blow dryer","Wiped with an apron"],correctAnswer:1,explanation:"Air Dry only! Towel drying re-contaminates clean sanitized utensils.",category:"hygiene",manualPage:32},{id:"qr-p35-1",source:"HACCP System (Page 35-36)",question:"What does HACCP stand for?",options:["Hazard Analysis Critical Control Point","Health And Cooking Certification Program","Hospitality And Culinary Control Process","Hygiene Assessment Cleanliness Certificate Plan"],correctAnswer:0,explanation:"Hazard Analysis Critical Control Point (pioneered by Pillsbury in the 1960s for NASA astronaut food safety).",category:"haccp",manualPage:35},{id:"qr-p38-1",source:"Pest Control (Page 38-39)",question:"Why is the use of electric fly zappers (grid electrocuters) prohibited in food preparation areas?",options:["They use too much electricity","Electrocuted fly body parts shatter and become airborne, falling onto food and clean surfaces","They make too much buzzing noise","They attract mice"],correctAnswer:1,explanation:'Fly zappers explode flies and propel contaminated fly particles into food areas. Only non-exploding sticky "fly catchers" (glue traps) are permitted indoors.',category:"pest",manualPage:39},{id:"qr-p40-1",source:"Pest Control (Page 40-41)",question:"The presence of German cockroaches during daytime hours in a kitchen is usually an indication of:",options:["Normal harmless behavior","A severe roach infestation","Roaches looking for sunlight","Recent extermination"],correctAnswer:1,explanation:"Because roaches are nocturnal, seeing them in broad daylight indicates overcrowding and a severe infestation.",category:"pest",manualPage:40},{id:"qr-p48-1",source:"Plumbing (Page 48-49)",question:"What is a cross-connection in plumbing and why is it dangerous?",options:["Two sinks connected to the same light switch","Any connection between potable (drinking) water and non-potable/sewage water that allows backflow into drinking water","A faucet with two handles","Hot water pipes crossing cold water pipes"],correctAnswer:1,explanation:"Cross-connection allows backflow or siphonage of sewage or chemical waste into the potable water supply. Protected with vacuum breakers and air gaps.",category:"plumbing",manualPage:48},{id:"qr-p56-1",source:"Local Law 12 CPR (Page 56)",question:"Under NYC Local Law 12, what resuscitation equipment must restaurants and taverns that sell food for on-premise consumption maintain?",options:["Full defibrillator hospital machine and oxygen tank","1 adult exhaled resuscitation mask, 1 pediatric mask, 2 pairs of latex gloves, and a notice sign","First aid kit with aspirin only","No equipment is required"],correctAnswer:1,explanation:"1 adult mask, 1 pediatric mask, 2 pairs of latex gloves, and a conspicuous sign informing patrons where resuscitation equipment is located.",category:"law",manualPage:56}],If=[...cs,...fm,...mm,...hm,...pm],lg=({progress:N,onUpdateProgress:v})=>{var Ge;const[j,d]=Z.useState("quiz1"),[k,Q]=Z.useState(cs),[q,J]=Z.useState(0),[_,T]=Z.useState({}),[B,G]=Z.useState(new Set),[L,ge]=Z.useState(!1),[de,le]=Z.useState(!1),[U,ue]=Z.useState(3600),[fe,ne]=Z.useState(!1),we=[{key:"quiz1",title:"Quiz No. 1",desc:"12 Questions • Page 75",qList:cs},{key:"quiz2",title:"Quiz No. 2",desc:"12 Questions • Page 76",qList:fm},{key:"quiz3",title:"Quiz No. 3",desc:"12 Questions • Page 77",qList:mm},{key:"quiz4",title:"Quiz No. 4",desc:"10 Questions • Page 78",qList:hm},{key:"quick-reviews",title:"Quick Reviews",desc:"14 Core Review Items from Manual",qList:pm},{key:"mock-50",title:"Full 50-Q Mock Exam",desc:"Timed Official Simulation (70% to Pass)",qList:If,isMock:!0}],ce=h=>{D.playClick(),d(h);const E=we.find(se=>se.key===h);let F=E?E.qList:cs;h==="mock-50"?(F=[...If].sort(()=>Math.random()-.5).slice(0,50),ne(!0),ue(3600)):ne(!1),Q(F),J(0),T({}),G(new Set),ge(!1),le(!1)};Z.useEffect(()=>{if(!fe||L)return;const h=setInterval(()=>{ue(E=>E<=1?(S(),0):E-1)},1e3);return()=>clearInterval(h)},[fe,L]);const Se=h=>{L||(D.playClick(),D.triggerHaptic("light"),T(E=>({...E,[q]:h})))},P=h=>{D.playClick(),G(E=>{const F=new Set(E);return F.has(h)?F.delete(h):F.add(h),F})},S=()=>{D.playClick(),ge(!0);let h=0;k.forEach((r,g)=>{_[g]===r.correctAnswer&&h++});const F=Math.round(h/k.length*100)>=70;F?(D.playWin(),Gn({particleCount:100,spread:70,origin:{y:.6}}),Ua("first_quiz"),j==="mock-50"&&Ua("passe
